<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid2Shiba (AST2) Mining</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .level-badge { font-size: 1.5em; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="current-level-badge" class="level-badge">Level 1</div>
        <p>Telegram ID: <span id="tg-id">-</span></p>
        <h3>Balance: <span id="total-balance">0.00</span> AST2</h3>
    </div>

    <div class="card">
        <h3>Manual Withdrawal</h3>
        <input type="text" id="withdraw-address" placeholder="Enter TON Wallet Address (min 40 chars)">
        <input type="number" id="withdraw-amount" placeholder="Amount (Min 50 AST2)">
        <button id="withdraw-btn" onclick="requestManualWithdrawal()">Withdraw AST2</button>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_URL.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

        // Struktur Perjalanan Level & Syarat Saldo Kumulatif
        const levelsData = [
            { level: 1, claim: 14.4, kumulatif: 0 },
            { level: 2, claim: 15.12, kumulatif: 50 },
            { level: 3, claim: 15.88, kumulatif: 140 },
            { level: 4, claim: 16.67, kumulatif: 302 },
            { level: 5, claim: 17.51, kumulatif: 594 },
            { level: 6, claim: 18.38, kumulatif: 1119 },
            { level: 7, claim: 19.3, kumulatif: 2065 },
            { level: 8, claim: 20.27, kumulatif: 3768 },
            { level: 9, claim: 21.28, kumulatif: 6833 }
        ];

        // State User Utama
        let userState = {
            telegramId: "",
            username: "",
            balance: 150, // Nilai default cadangan jika belum tersinkron
            currentLevel: 1
        };

        // Inisialisasi saat halaman dimuat
        window.onload = async function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userState.telegramId = tg.initDataUnsafe.user.id;
                    userState.username = tg.initDataUnsafe.user.username || "Player";
                }
            }
            
            // Mode Testing di Browser Biasa (Tanpa Telegram)
            if (!userState.telegramId) {
                userState.telegramId = "8707403735"; 
                userState.username = "TestUser";
            }

            document.getElementById("tg-id").innerText = userState.telegramId;
            
            // Sinkronisasi data user dengan database Supabase (tabel 'users')
            await syncUserToSupabase();
            renderUI();
        };

        // Fungsi Sinkronisasi & Ambil Data User dari Supabase
        async function syncUserToSupabase() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/users?telegram_id=eq.${userState.telegramId}`, {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                const data = await res.json();

                if (data && data.length > 0) {
                    // Jika user sudah ada di database, ambil data terbarunya
                    userState.balance = Number(data[0].balance);
                    
                    // Hitung ulang level secara otomatis berdasarkan saldo database
                    for (let i = levelsData.length - 1; i >= 0; i--) {
                        if (userState.balance >= levelsData[i].kumulatif) {
                            userState.currentLevel = levelsData[i].level;
                            break;
                        }
                    }
                } else {
                    // Jika user belum terdaftar, daftarkan otomatis ke tabel 'users'
                    await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                            "Prefer": "return=minimal"
                        },
                        body: JSON.stringify({
                            telegram_id: Number(userState.telegramId),
                            username: userState.username,
                            balance: userState.balance,
                            current_level: userState.currentLevel
                        })
                    });
                }
            } catch (err) {
                console.error("Gagal sinkronisasi user ke Supabase:", err);
            }
        }

        // Fungsi Memperbarui Perubahan Data (Saldo & Level) ke Supabase
        async function updateUserDataInSupabase() {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/users?telegram_id=eq.${userState.telegramId}`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
                        balance: userState.balance,
                        current_level: userState.currentLevel
                    })
                });
            } catch (err) {
                console.error("Gagal update data user ke Supabase:", err);
            }
        }

        // Fungsi Utama Proses Penarikan (Withdrawal)
        async function requestManualWithdrawal() {
            let address = document.getElementById("withdraw-address").value.trim();
            let amount = parseFloat(document.getElementById("withdraw-amount").value);

            if (!address || address.length < 40) {
                alert("Please enter a valid TON wallet address!");
                return;
            }

            if (isNaN(amount) || amount < 50) {
                alert("Minimum withdrawal amount is 50 AST2");
                return;
            }

            if (amount > userState.balance) {
                alert("Insufficient AST2 balance!");
                return;
            }

            let submitBtn = document.getElementById("withdraw-btn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting to Database...";

            try {
                // 1. Simpan riwayat transaksi ke tabel 'withdrawals' Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/withdrawals`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        telegram_id: Number(userState.telegramId),
                        wallet_address: address,
                        amount: amount,
                        status: 'pending'
                    })
                });

                if (response.ok || response.status === 201) {
                    // 2. Kurangi saldo pengguna
                    userState.balance -= amount;

                    // 3. Hitung otomatis penurunan level berdasarkan sisa saldo terbaru
                    for (let i = levelsData.length - 1; i >= 0; i--) {
                        if (userState.balance >= levelsData[i].kumulatif) {
                            userState.currentLevel = levelsData[i].level;
                            break;
                        }
                    }

                    // 4. Perbarui data profil user di tabel 'users' & render tampilan UI
                    await updateUserDataInSupabase();
                    renderUI();

                    document.getElementById("withdraw-address").value = "";
                    document.getElementById("withdraw-amount").value = "";
                    
                    alert("Withdrawal request has been submitted successfully!");
                } else {
                    const errData = await response.json();
                    alert("Error: " + (errData.message || "Gagal memproses penarikan"));
                }
            } catch (err) {
                alert("Koneksi error: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Withdraw AST2";
            }
        }

        // Render Tampilan Antarmuka (UI)
        function renderUI() {
            document.getElementById("total-balance").innerText = userState.balance.toFixed(2);
            document.getElementById("current-level-badge").innerText = `Level ${userState.currentLevel}`;
        }
    </script>
</body>
</html>
